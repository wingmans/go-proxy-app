services:
  caddy:
    image: ${PROXY_IMAGE:-go-proxy-app-throttling:0.2.0}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROXY_PORT:-8090}:8080"
    environment:
      - PROXY_USER
      - PROXY_HASH
    labels:
      app.proxy.policy-sha256: ${POLICY_HASH:-unconfigured}
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

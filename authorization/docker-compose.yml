name: authorization

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      mock-api:
        condition: service_healthy
    ports:
      # Keep the credential-bearing proxy local unless you add client auth.
      - "127.0.0.1:${AUTH_PROXY_PORT:-8091}:8080"
    environment:
      AUTH_PROXY_USER: ${AUTH_PROXY_USER:?Set AUTH_PROXY_USER in .env}
      AUTH_PROXY_HASH: ${AUTH_PROXY_HASH:?Set AUTH_PROXY_HASH in .env}
      API_UPSTREAM: ${API_UPSTREAM:?Set API_UPSTREAM in .env}
      API_AUTH_HEADER: ${API_AUTH_HEADER:?Set API_AUTH_HEADER in .env}
      API_AUTH_VALUE: ${API_AUTH_VALUE:?Set API_AUTH_VALUE in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.mock-api
    environment:
      EXPECTED_AUTH_HEADER: ${API_AUTH_HEADER:-Authorization}
      EXPECTED_AUTH_VALUE: ${API_AUTH_VALUE:-Basic dGVzdC11c2VyOnRlc3QtcGFzc3dvcmQ=}
    healthcheck:
      test: ["CMD", "/mock-api", "healthcheck"]
      interval: 2s
      timeout: 1s
      retries: 10

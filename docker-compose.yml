services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxy-caddy-1
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - PROXY_USER=${PROXY_USER}
      - PROXY_HASH=${PROXY_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 10s
      timeout: 5s
      retries: 3
